site:
  name: Food Access Healthy Neighborhoods Now
  site: 'https://fahnn.netlify.app'
  base: '/'
  trailingSlash: false

  # Set this to FAHNN's own ID from Google Search Console when the site is verified.
  googleSiteVerificationId: null

# Default SEO metadata
metadata:
  title:
    default: Food Access Healthy Neighborhoods Now
    template: '%s — Food Access Healthy Neighborhoods Now'
  description: 'Food and health are human rights. FAHNN is a neighbor-led nonprofit in Syracuse’s Valley/Southside bringing fresh food and health services back to the neighborhood.'
  robots:
    index: true
    follow: true
  # Link preview when the site is shared (Facebook, texts, email). Cropped to 1200×628.
  openGraph:
    site_name: Food Access Healthy Neighborhoods Now
    images:
      - url: '~/assets/images/farmers_market_outside.png'
        width: 1200
        height: 628
    type: website

i18n:
  language: en
  textDirection: ltr

apps:
  blog:
    isEnabled: true
    postsPerPage: 8

    post:
      isEnabled: true
      permalink: '/%slug%' # Variables: %slug%, %year%, %month%, %day%, %hour%, %minute%, %second%, %category%
      robots:
        index: true

    list:
      isEnabled: true
      pathname: 'blog' # Blog main path, you can change this to "articles" (/articles)
      robots:
        index: true

    category:
      isEnabled: true
      pathname: 'category' # Category main path /category/some-category, you can change this to "group" (/group/some-category)
      robots:
        index: true

    tag:
      isEnabled: true
      pathname: 'tag' # Tag main path /tag/some-tag, you can change this to "topics" (/topics/some-category)
      robots:
        index: false

    isRelatedPostsEnabled: true
    relatedPostsCount: 4

analytics:
  vendors:
    googleAnalytics:
      id: null # or "G-XXXXXXXXXX"

ui:
  theme: 'system' # Values: "system" | "light" | "dark" | "light:only" | "dark:only"
